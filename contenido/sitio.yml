frase_es: Cineasta, fotógrafo y director escénico.
frase_en: Filmmaker, photographer and stage director.
lugar_es: Costa Rica
lugar_en: Costa Rica
manifiesto_es: La magia de lo cotidiano y el poder del subconsciente para crear.
manifiesto_en: The magic of everyday life and the power of the subconscious to create.
rol_es: Narrador visual
rol_en: Visual storyteller
cierre_es: ¿Tenés un proyecto? Contame.
cierre_en: Have a project in mind? Let's talk.
bio_corta_es: Licenciado en Cine y Televisión (Universidad Veritas) y Bachiller en Ciencias de la Comunicación Colectiva (UCR). Más de 20 años entre televisión, cine, fotografía y escena. Profesor de narración en la UCR de 2017 a 2020.
bio_corta_en: Licentiate in Film and Television (Veritas University) and BA in Media and Communication (University of Costa Rica). Over 20 years across television, film, photography and stage. Storytelling professor at the University of Costa Rica, 2017–2020.
