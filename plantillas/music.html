{% extends "base.html" %}{% from "macros.html" import L with context %}
{% block body %}
<main class="wrap">
  <header class="page-top">
    <p class="eyebrow">{{ t.music_eyebrow }}</p>
    <h1 class="display">{{ L('music') }}</h1>
    <p class="lead">{{ t.music_lead }}</p>
  </header>
  <div class="spotify">
  {% for r in mu.lanzamientos %}
    <div class="{{ r.tipo }}"><p class="eyebrow" style="margin-bottom:10px">{{ r.titulo }}</p><iframe title="{{ r.titulo }}" src="https://open.spotify.com/embed/{{ r.tipo }}/{{ r.id }}?theme=0" loading="lazy" allow="encrypted-media"></iframe></div>
  {% endfor %}
  </div>
</main>
{% endblock %}
