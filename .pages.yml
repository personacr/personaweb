# Pages CMS (app.pagescms.org) · solo toca contenido, nunca el diseño.
# Elegí la carpeta img/subidas al subir fotos nuevas; y GitHub las convierte solas a 3 tamaños livianos.
media:
  input: img
  output: img
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: photo
    label: Photo · capítulos
    type: collection
    path: contenido/photo
    format: yaml
    extension: yml
    filename: '{fields.slug}.yml'
    view:
      fields: [titulo_es, orden]
      primary: titulo_es
      sort: [orden]
      default: { sort: orden, order: asc }
    fields:
      - { name: orden, label: Orden en el menú, type: number }
      - { name: numero, label: Número (I, II…), type: string }
      - { name: slug, label: Dirección en español (no cambiar), type: string }
      - { name: slug_en, label: Dirección en inglés (no cambiar), type: string }
      - { name: titulo_es, label: Título (ES), type: string }
      - { name: titulo_en, label: Título (EN), type: string }
      - { name: intro_es, label: Una línea de introducción (ES), type: text }
      - { name: intro_en, label: Una línea de introducción (EN), type: text }
      - { name: portada, label: Portada, type: image }
      - name: premios
        label: Premios o nominaciones (aparecen junto al nombre del grupo)
        type: object
        list: true
        fields:
          - { name: grupo, label: Nombre exacto del grupo (ES), type: string }
          - { name: imagen, label: Sello (ruta sin tamaño), type: string }
          - { name: texto_es, label: Texto (ES), type: string }
          - { name: texto_en, label: Texto (EN), type: string }
          - { name: url, label: Enlace oficial, type: string }
      - name: fotos
        label: Fotos (arrastrá para cambiar el orden)
        type: object
        list: true
        fields:
          - { name: archivo, label: Foto, type: image }
          - name: formato
            label: Peso en el mosaico
            type: select
            options: { values: [completa, par, detalle] }
          - { name: pie_es, label: Descripción para Google y lectores de pantalla (ES · no se muestra), type: string }
          - { name: pie_en, label: Descripción para Google y lectores de pantalla (EN · no se muestra), type: string }
          - { name: credito, label: Crédito (artista · año), type: string }
          - { name: grupo_es, label: Subtítulo de grupo (ES, opcional), type: string }
          - { name: grupo_en, label: Subtítulo de grupo (EN, opcional), type: string }
          - { name: w, label: Ancho (automático), type: number }
          - { name: h, label: Alto (automático), type: number }
          - { name: color, label: Color (automático), type: string }

  - name: motion
    label: Motion
    type: file
    path: contenido/motion.yml
    format: yaml
    fields:
      - name: proyectos
        label: Filmografía
        type: object
        list: true
        fields:
          - { name: slug, label: Identificador (sin espacios), type: string }
          - { name: titulo, label: Título, type: string }
          - { name: anio, label: Año, type: string }
          - { name: tipo_es, label: Formato (ES), type: string }
          - { name: tipo_en, label: Formato (EN), type: string }
          - { name: rol_es, label: Rol (ES), type: string }
          - { name: rol_en, label: Rol (EN), type: string }
          - { name: sinopsis_es, label: Sinopsis (ES), type: text }
          - { name: sinopsis_en, label: Sinopsis (EN), type: text }
          - { name: portada, label: Imagen de portada (opcional), type: image }
          - name: videos
            label: Videos
            type: object
            list: true
            fields:
              - { name: plataforma, label: Plataforma, type: select, options: { values: [vimeo, youtube, instagram] } }
              - { name: id, label: Código del video (lo que va al final del link), type: string }
              - { name: formato, label: Formato, type: select, options: { values: [horizontal, vertical] } }
              - { name: titulo, label: Título, type: string }
          - name: banda_sonora
            label: Banda sonora (Spotify)
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: tipo, label: Tipo, type: select, options: { values: [album, track] } }
              - { name: id, label: Código de Spotify, type: string }
      - name: reels
        label: Reels
        type: object
        list: true
        fields:
          - { name: plataforma, label: Plataforma, type: select, options: { values: [vimeo, youtube, instagram] } }
          - { name: id, label: Código del video, type: string }
          - { name: formato, label: Formato, type: select, options: { values: [vertical, horizontal] } }
          - { name: titulo, label: Título, type: string }
      - name: bitacora
        label: Bitácora en video
        type: object
        list: true
        fields:
          - { name: plataforma, label: Plataforma, type: select, options: { values: [vimeo, youtube, instagram] } }
          - { name: id, label: Código del video, type: string }
          - { name: formato, label: Formato, type: select, options: { values: [vertical, horizontal] } }
          - { name: titulo, label: Título, type: string }

  - name: stage
    label: Stage
    type: file
    path: contenido/stage.yml
    format: yaml
    fields:
      - name: proyectos
        label: Producciones
        type: object
        list: true
        fields:
          - { name: slug, label: Identificador (sin espacios), type: string }
          - { name: titulo, label: Título, type: string }
          - { name: anio, label: Año, type: string }
          - { name: rol_es, label: Rol (ES), type: string }
          - { name: rol_en, label: Rol (EN), type: string }
          - { name: sinopsis_es, label: Sinopsis (ES), type: text }
          - { name: sinopsis_en, label: Sinopsis (EN), type: text }
          - { name: fotos, label: Fotos, type: image, options: { multiple: true } }
          - name: enlaces
            label: Enlaces
            type: object
            list: true
            fields:
              - { name: texto, label: Texto, type: string }
              - { name: url, label: Dirección, type: string }
          - name: videos
            label: Videos
            type: object
            list: true
            fields:
              - { name: plataforma, label: Plataforma, type: select, options: { values: [vimeo, youtube, instagram] } }
              - { name: id, label: Código del video, type: string }
              - { name: formato, label: Formato, type: select, options: { values: [horizontal, vertical] } }
              - { name: titulo, label: Título, type: string }
          - name: banda_sonora
            label: Banda sonora (Spotify)
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: tipo, label: Tipo, type: select, options: { values: [album, track] } }
              - { name: id, label: Código de Spotify, type: string }

  - name: sitio
    label: Textos generales
    type: file
    path: contenido/sitio.yml
    format: yaml
    fields:
      - { name: nombre, label: Nombre visible, type: string }
      - { name: nombre_alterno, label: Variantes del nombre (para Google), type: string, list: true }
      - { name: url, label: Dirección del sitio, type: string }
      - { name: frase_es, label: Frase principal (ES), type: string }
      - { name: frase_en, label: Frase principal (EN), type: string }
      - { name: lugar_es, label: Línea de ubicación (ES), type: string }
      - { name: lugar_en, label: Línea de ubicación (EN), type: string }
      - { name: rol_es, label: Línea sobre la frase principal (ES), type: string }
      - { name: rol_en, label: Línea sobre la frase principal (EN), type: string }
      - { name: manifiesto_es, label: Manifiesto (ES · hoy no se muestra en el sitio), type: string }
      - { name: manifiesto_en, label: Manifiesto (EN · hoy no se muestra en el sitio), type: string }
      - { name: cierre_es, label: Frase de cierre antes del contacto (ES), type: string }
      - { name: cierre_en, label: Frase de cierre antes del contacto (EN), type: string }
      - { name: bio_corta_es, label: Bio corta (ES), type: text }
      - { name: bio_corta_en, label: Bio corta (EN), type: text }
      - { name: email, type: string }
      - { name: whatsapp, type: string }
      - { name: instagram, type: string }
      - { name: vimeo, type: string }
      - { name: linkedin, type: string }
      - { name: bio, label: Link a la Bio, type: string }
      - { name: formspree, type: string }
      - { name: ga4, label: Google Analytics, type: string }
      - name: servicios
        label: Servicios
        type: object
        list: true
        fields:
          - { name: titulo_es, label: Título (ES), type: string }
          - { name: titulo_en, label: Título (EN), type: string }
          - { name: texto_es, label: Texto (ES), type: string }
          - { name: texto_en, label: Texto (EN), type: string }
          - { name: enlace, label: Enlace interno, type: string }
          - { name: imagen, label: Foto (ruta sin tamaño, ej. img/photo/marcas/grupo-del-este-marcas-2026-02), type: string }
      - name: disciplinas
        label: Sobre mí · líneas por disciplina
        type: object
        list: true
        fields:
          - { name: icono, label: Ícono (▭ ◎ ⌒), type: string }
          - { name: texto_es, label: Texto (ES), type: string }
          - { name: texto_en, label: Texto (EN), type: string }
      - name: reconocimientos
        label: Sobre mí · reconocimientos (el más reciente arriba)
        type: object
        list: true
        fields:
          - { name: icono, label: Ícono (▭ motion · ◎ photo · ⌒ stage), type: string }
          - { name: anio, label: Año, type: string }
          - { name: titulo_es, label: Premio o nominación (ES), type: string }
          - { name: titulo_en, label: Premio o nominación (EN), type: string }
          - { name: evento_es, label: Festival o institución (ES), type: string }
          - { name: evento_en, label: Festival o institución (EN), type: string }
          - { name: obra, label: Obra, type: string }
          - { name: imagen, label: Sello (opcional · ruta sin tamaño), type: string }
          - { name: url, label: Enlace oficial (opcional), type: string }
      - name: clientes
        label: Clientes con logo
        type: object
        list: true
        fields:
          - { name: logo, label: Logo (PNG/SVG en un color), type: image }
          - { name: nombre, label: Nombre, type: string }
      - { name: clientes_sin_logo, label: Clientes sin logo, type: string, list: true }
      - { name: mosaico, label: "Home · Mosaico de fotos (capítulo:número de foto)", type: string, list: true }
