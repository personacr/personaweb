name: Armar sitio
on:
  push:
    paths: ['contenido/**', 'plantillas/**', 'herramientas/**', 'styles.css', 'site.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jinja2
      - run: python3 herramientas/construir.py
      - run: |
          git config user.name "persona-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || (git commit -m "Arma páginas desde el contenido" && git push))
